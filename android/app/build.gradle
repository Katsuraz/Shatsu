plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.katsuraz.shatsu'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.katsuraz.shatsu'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.3.2-alpha'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
