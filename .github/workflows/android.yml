name: Shatsu Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable Android debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Upload Shatsu Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Shatsu-v0.2.0-alpha-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish downloadable GitHub prerelease APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk Shatsu-v0.2.0-alpha-debug.apk
          if gh release view v0.2.0-alpha > /dev/null 2>&1; then
            gh release upload v0.2.0-alpha Shatsu-v0.2.0-alpha-debug.apk --clobber
          else
            gh release create v0.2.0-alpha Shatsu-v0.2.0-alpha-debug.apk \
              --target "$GITHUB_SHA" \
              --title "Shatsu v0.2.0 Alpha (experimental)" \
              --notes "Experimental Android debug APK for Shatsu. The app needs a separately deployed Shatsu server URL; this APK does not host rooms. Spotify sign-in requires a Spotify developer app, eligible accounts, and using Brave. This APK is not production-signed and may require uninstalling prior debug builds to install updates." \
              --prerelease
          fi
