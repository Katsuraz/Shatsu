name: Shatsu Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Shatsu Android debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Shatsu-v0.4.1-alpha-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_VERSION=$(awk -F "'" '/versionName / {print $2; exit}' android/app/build.gradle)
          test -n "$APP_VERSION"
          TAG="v${APP_VERSION}"
          APK="Shatsu-${TAG}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Keeping it immutable; bump versionName for new builds."
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Shatsu ${TAG} — My Library, Playlists & Background Listening" \
              --notes "Shatsu v0.4.1 alpha Android APK. Includes Your Library with Liked Songs, custom playlists, play-all and queue-all, history, local JSON backup/export and room queue controls. The APK connects automatically to the live Shatsu web service. Audius offers experimental native background playback; official YouTube embedded videos stay foreground-only; Spotify playback requires eligible accounts and provider authorization. Installation requires Android confirmation; debug signing may change across builds, possibly requiring reinstall. This is experimental and has not been validated across two physical devices." \
              --prerelease
          fi
